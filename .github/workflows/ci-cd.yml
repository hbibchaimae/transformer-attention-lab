name: Transformer Lab - CI/CD Streamlit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: CI - Tests Python
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Installer les dependances
        run: python -m pip install -r requirements-dev.txt
      - name: Tests automatises
        run: python -m pytest -q
      - name: Verifier la syntaxe Python
        run: python -m compileall -q app.py attention_core.py

  deploy:
    name: CD - Promouvoir vers production
    needs: tests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recuperer le code valide
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publier uniquement apres reussite des tests
        shell: bash
        run: |
          git fetch origin production
          git push origin HEAD:refs/heads/production
